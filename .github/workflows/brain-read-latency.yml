name: Brain read latency
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/brain_latency.mjs'
      - 'scripts/brain_read_latency.py'
      - '.github/workflows/brain-read-latency.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: brain-native-latency-${{ github.ref }}
  cancel-in-progress: true
env:
  # The daemon names the DEV environment and declares schemas locally (lastdb#1142),
  # so no Schema Service definition check runs here.
  ENVIRONMENT: dev
  # Brain main at #498. It initializes the owned multi-key model like the candidate.
  APP_BEFORE: d629de7e2c9ed025f91bb8962d36c779afd4df7e
  # Both arms run the latest lastdb nightly, so the comparison is old app vs new app.
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
      oid: ${{ steps.nightly.outputs.oid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: node --check scripts/brain_latency.mjs
      - name: Fetch the latest lastdb nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release list -R EdgeVector/lastdb --exclude-drafts --limit 30 \
            --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag" && test "$tag" != null
          dir="$RUNNER_TEMP/lastdb-nightly"
          mkdir -p "$dir"
          gh release download "$tag" -R EdgeVector/lastdb -D "$dir" \
            -p 'lastdb-x86_64-unknown-linux-gnu.tar.gz' -p 'lastdb-x86_64-unknown-linux-gnu.manifest.json' -p SHA256SUMS.txt
          (cd "$dir" && grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          tar -xzf "$dir/lastdb-x86_64-unknown-linux-gnu.tar.gz" -C "$dir"
          for name in lastdb lastdbd; do
            want="$(jq -r --arg n "$name" '.binaries[] | select(.name == $n) | .sha256' "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
            test "$(sha256sum "$dir/$name" | cut -d' ' -f1)" = "$want"
          done
          oid="$(jq -r .source_git_oid "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
          sum="$(grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' "$dir/SHA256SUMS.txt" | cut -d' ' -f1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
          echo "lastdbd=$dir/lastdbd" >> "$GITHUB_OUTPUT"
          echo "lastdb=$dir/lastdb" >> "$GITHUB_OUTPUT"
          printf '### LastDB under test\n\nNightly `%s` (source `%s`), Linux tarball sha256 `%s`.\n' "$tag" "$oid" "$sum" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the lastdb support code of the nightly source
        env:
          LASTDB_REVISION: ${{ steps.nightly.outputs.oid }}
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/lastdb-source"
          git init "$directory"
          git -C "$directory" remote add origin https://github.com/EdgeVector/lastdb.git
          git -C "$directory" fetch --depth 1 origin "$LASTDB_REVISION"
          git -C "$directory" checkout --detach FETCH_HEAD
          test "$(git -C "$directory" rev-parse HEAD)" = "$LASTDB_REVISION"
      - name: Stage the one daemon program for both arms
        env:
          LASTDBD: ${{ steps.nightly.outputs.lastdbd }}
          TAG: ${{ steps.nightly.outputs.tag }}
          LASTDB_REVISION: ${{ steps.nightly.outputs.oid }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/brain-binaries"
          cp "$LASTDBD" "$RUNNER_TEMP/brain-binaries/lastdbd"
          cd "$RUNNER_TEMP/brain-binaries"
          sha256sum lastdbd > SHA256SUMS
          printf 'Tag: %s\nSource: %s\n' "$TAG" "$LASTDB_REVISION" > revisions.txt
      - name: Retain the exact daemon programs
        id: binaries
        uses: actions/upload-artifact@v4
        with:
          name: brain-native-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-binaries/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the binary artifact identity and expiry
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.binaries.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.binaries.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.binaries.outputs.artifact-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/binary-artifact.json"
          python3 "$RUNNER_TEMP/lastdb-source/scripts/benchmarks/artifact.py" \
            --metadata "$RUNNER_TEMP/binary-artifact.json" --output "$RUNNER_TEMP/binary-artifact-receipt"
  measure:
    name: ${{ matrix.mode }}-latency-${{ matrix.records }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: read, records: 1000, repeats: 3, body_bytes: 0}
          - {mode: operations, records: 128, repeats: 1, body_bytes: 4096}
          - {mode: operations, records: 1024, repeats: 3, body_bytes: 4096}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: Retain the source reader and daemon support code
        env:
          LASTDB_REVISION: ${{ needs.build.outputs.oid }}
        shell: bash
        run: |
          set -euo pipefail
          for label in brain-before lastdb-source; do
            if [ "$label" = brain-before ]; then repository=brain; revision="$APP_BEFORE"; else repository=lastdb; revision="$LASTDB_REVISION"; fi
            directory="$RUNNER_TEMP/$label"
            git init "$directory"
            git -C "$directory" remote add origin "https://github.com/EdgeVector/$repository.git"
            git -C "$directory" fetch --depth 1 origin "$revision"
            git -C "$directory" checkout --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          done
          cd "$RUNNER_TEMP/brain-before"
          bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: brain-native-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-binaries/
      - name: Verify the downloaded program checksums
        run: |
          cd "$RUNNER_TEMP/brain-binaries"
          sha256sum --check SHA256SUMS
          chmod +x lastdbd
      - name: Measure the actual app operations before and after
        env:
          LASTDB_TAG: ${{ needs.build.outputs.tag }}
          LASTDB_REVISION: ${{ needs.build.outputs.oid }}
        run: |
          python3 scripts/brain_read_latency.py --mode '${{ matrix.mode }}' \
            --baseline "$RUNNER_TEMP/brain-before" --candidate "$GITHUB_WORKSPACE" \
            --app-baseline-revision "$APP_BEFORE" --app-revision "$APP_AFTER" \
            --lastdb-source "$RUNNER_TEMP/lastdb-source" --binary "$RUNNER_TEMP/brain-binaries/lastdbd" \
            --revision "$LASTDB_REVISION" --lastdb-tag "$LASTDB_TAG" \
            --records '${{ matrix.records }}' --repeats '${{ matrix.repeats }}' --samples 5 \
            --body-bytes '${{ matrix.body_bytes }}' --output "$RUNNER_TEMP/brain-results"
      - name: Retain raw samples and source identities
        if: always()
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.mode }}-${{ matrix.records }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the measurement artifact identity and expiry
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/measurement-artifact.json"
          python3 "$RUNNER_TEMP/lastdb-source/scripts/benchmarks/artifact.py" \
            --metadata "$RUNNER_TEMP/measurement-artifact.json" --output "$RUNNER_TEMP/measurement-artifact-receipt"
  benchmark-complete:
    if: ${{ always() }}
    needs: [build, measure]
    runs-on: ubuntu-24.04
    steps:
      - name: Require real operations, measurements, and verified artifact uploads
        env:
          BUILD: ${{ needs.build.result }}
          MEASUREMENTS: ${{ needs.measure.result }}
        run: |
          test "$BUILD" = success
          test "$MEASUREMENTS" = success
