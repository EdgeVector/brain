name: Brain read latency
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/brain_latency.mjs'
      - 'scripts/brain_read_latency.py'
      - '.github/workflows/brain-read-latency.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: brain-native-latency-${{ github.ref }}
  cancel-in-progress: true
env:
  # CI uses the DEV Schema Service. The definition check and both daemons read this
  # one value, so they always name the same registry. Production needs publisher authority.
  ENVIRONMENT: dev
  APP_BEFORE: 648cef807fcd9e08615eb8d9065649baf8a2f0f3
  DAEMON_BEFORE: 46f1b2d6fd329b4931fd0f9e18f4fe39adb7bc56
  DAEMON_AFTER: a83d5f06da5bfac12b8341594513743fbb3ffabd
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: node --check scripts/brain_latency.mjs
      - name: Retain exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          for label in brain-before daemon-before daemon-after; do
            case "$label" in
              brain-before) repository=brain; revision="$APP_BEFORE" ;;
              daemon-before) repository=lastdb; revision="$DAEMON_BEFORE" ;;
              daemon-after) repository=lastdb; revision="$DAEMON_AFTER" ;;
            esac
            directory="$RUNNER_TEMP/$label"
            git init "$directory"
            git -C "$directory" remote add origin "https://github.com/EdgeVector/$repository.git"
            git -C "$directory" fetch --depth 1 origin "$revision"
            git -C "$directory" checkout --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          done
          cd "$RUNNER_TEMP/brain-before"
          bun install --frozen-lockfile
      - name: Require registered definitions before the build
        run: |
          python3 scripts/brain_read_latency.py --mode catalog \
            --baseline "$RUNNER_TEMP/brain-before" --candidate "$GITHUB_WORKSPACE" \
            --app-baseline-revision "$APP_BEFORE" --app-revision "$APP_AFTER" \
            --lastdb-source "$RUNNER_TEMP/daemon-after" \
            --baseline-binary "$RUNNER_TEMP/brain-binaries/before" --binary "$RUNNER_TEMP/brain-binaries/after" \
            --baseline-revision "$DAEMON_BEFORE" --revision "$DAEMON_AFTER" \
            --records 1000 --output "$RUNNER_TEMP/brain-definitions"
      - name: Build the compatible and native daemons once
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/brain-binaries"
          for label in before after; do
            if [ "$label" = before ]; then revision="$DAEMON_BEFORE"; else revision="$DAEMON_AFTER"; fi
            cd "$RUNNER_TEMP/daemon-$label"
            FOLDDB_BUILD_VERSION_OVERRIDE="bench-$revision" \
              CARGO_TARGET_DIR="$RUNNER_TEMP/brain-target-$label" \
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
            cp "$RUNNER_TEMP/brain-target-$label/dev-release/lastdbd" "$RUNNER_TEMP/brain-binaries/$label"
            rm -rf "$RUNNER_TEMP/brain-target-$label"
          done
          cd "$RUNNER_TEMP/brain-binaries"
          sha256sum before after > SHA256SUMS
          printf 'Before: %s\nAfter: %s\n' "$DAEMON_BEFORE" "$DAEMON_AFTER" > revisions.txt
      - name: Retain definition results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-definitions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-definitions/
          if-no-files-found: error
          retention-days: 14
      - name: Retain the exact daemon programs
        id: binaries
        uses: actions/upload-artifact@v4
        with:
          name: brain-native-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-binaries/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the binary artifact identity and expiry
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.binaries.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.binaries.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.binaries.outputs.artifact-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/binary-artifact.json"
          python3 "$RUNNER_TEMP/daemon-after/scripts/benchmarks/artifact.py" \
            --metadata "$RUNNER_TEMP/binary-artifact.json" --output "$RUNNER_TEMP/binary-artifact-receipt"
  measure:
    name: ${{ matrix.mode }}-latency-${{ matrix.records }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: read, records: 1000, repeats: 3, body_bytes: 0}
          - {mode: read, records: 10000, repeats: 3, body_bytes: 0}
          - {mode: operations, records: 128, repeats: 1, body_bytes: 4096}
          - {mode: operations, records: 1024, repeats: 3, body_bytes: 4096}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: Retain the source reader and daemon support code
        shell: bash
        run: |
          set -euo pipefail
          for label in brain-before daemon-after; do
            if [ "$label" = brain-before ]; then repository=brain; revision="$APP_BEFORE"; else repository=lastdb; revision="$DAEMON_AFTER"; fi
            directory="$RUNNER_TEMP/$label"
            git init "$directory"
            git -C "$directory" remote add origin "https://github.com/EdgeVector/$repository.git"
            git -C "$directory" fetch --depth 1 origin "$revision"
            git -C "$directory" checkout --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          done
          cd "$RUNNER_TEMP/brain-before"
          bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: brain-native-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-binaries/
      - name: Verify the downloaded program checksums
        run: |
          cd "$RUNNER_TEMP/brain-binaries"
          sha256sum --check SHA256SUMS
          chmod +x before after
      - name: Measure the actual app operations before and after
        run: |
          python3 scripts/brain_read_latency.py --mode '${{ matrix.mode }}' \
            --baseline "$RUNNER_TEMP/brain-before" --candidate "$GITHUB_WORKSPACE" \
            --app-baseline-revision "$APP_BEFORE" --app-revision "$APP_AFTER" \
            --lastdb-source "$RUNNER_TEMP/daemon-after" \
            --baseline-binary "$RUNNER_TEMP/brain-binaries/before" --binary "$RUNNER_TEMP/brain-binaries/after" \
            --baseline-revision "$DAEMON_BEFORE" --revision "$DAEMON_AFTER" \
            --records '${{ matrix.records }}' --repeats '${{ matrix.repeats }}' --samples 5 \
            --body-bytes '${{ matrix.body_bytes }}' --output "$RUNNER_TEMP/brain-results"
      - name: Retain raw samples and source identities
        if: always()
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.mode }}-${{ matrix.records }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brain-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the measurement artifact identity and expiry
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/measurement-artifact.json"
          python3 "$RUNNER_TEMP/daemon-after/scripts/benchmarks/artifact.py" \
            --metadata "$RUNNER_TEMP/measurement-artifact.json" --output "$RUNNER_TEMP/measurement-artifact-receipt"
  benchmark-complete:
    if: ${{ always() }}
    needs: [build, measure]
    runs-on: ubuntu-24.04
    steps:
      - name: Require real operations, measurements, and verified artifact uploads
        env:
          BUILD: ${{ needs.build.result }}
          MEASUREMENTS: ${{ needs.measure.result }}
        run: |
          test "$BUILD" = success
          test "$MEASUREMENTS" = success
