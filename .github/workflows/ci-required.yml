name: ci-required

# Gate of record for EdgeVector/brain is GitHub (2026-09-30).
# Brain: decision-2026-09-29-retire-lastgit-all-repos-to-github.
# `check` runs .lastgit/ci.sh (shell syntax, frozen install, typecheck). CI runs
# no tests; the tests were deleted on 2026-10-09. The final job `ci-required`
# is the protected status name. Keep the job name verbatim.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin avoids setup-bun's GitHub API lookup for "latest".
          bun-version: "1.3.10"

      - name: ci.sh (syntax, install, typecheck)
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        run: |
          echo "check=${{ needs.check.result }}"
          test "${{ needs.check.result }}" = "success"

  registry-commit:
    name: Registry commit identity
    needs: [ci-required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/registry-commit.py
