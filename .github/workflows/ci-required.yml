name: ci-required

# Gate of record for EdgeVector/brain is GitHub (2026-09-30).
# Brain: decision-2026-09-29-retire-lastgit-all-repos-to-github.
# `check` runs .lastgit/ci.sh (shell syntax, frozen install, typecheck). CI runs
# no tests; the tests were deleted on 2026-10-09. The final job `ci-required`
# is the protected status name. Keep the job name verbatim.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin avoids setup-bun's GitHub API lookup for "latest".
          bun-version: "1.3.10"

      - name: ci.sh (syntax, install, typecheck)
        run: bash .lastgit/ci.sh

  # Compile + sign the standalone brain-mcp binary and prove it boots the MCP
  # stdio surface. macOS only: codesign must match the folddb.toml
  # [code_signature] bundle id. Reports as its own check; it does not gate
  # ci-required (same as before the move).
  build-mcp-binary:
    name: build-mcp-binary
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile + sign fbrain-mcp
        run: bun run build:mcp

      - name: Verify signature matches manifest bundle id
        run: |
          codesign -dv dist/fbrain-mcp 2>&1 | tee /tmp/codesign.txt
          grep -q 'Identifier=com.edgevector.fbrain' /tmp/codesign.txt
          codesign --verify --verbose dist/fbrain-mcp

      - name: Smoke-test the compiled MCP surface
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./dist/fbrain-mcp 2>/tmp/mcp-stderr.log > /tmp/mcp-out.txt
          cat /tmp/mcp-stderr.log
          n=$(bun -e 'const ls=require("fs").readFileSync("/tmp/mcp-out.txt","utf8").trim().split("\n"); const r=JSON.parse(ls[1]); const names=r.result.tools.map(t=>t.name); console.log(names.join(",")); process.stderr.write(String(names.length));' 2>/tmp/mcp-count.txt)
          echo "tools: $n"
          expected=$(bun -e 'import { FBRAIN_MCP_TOOL_NAMES } from "./src/mcp/tools.ts"; process.stdout.write(String(FBRAIN_MCP_TOOL_NAMES.length));')
          test "$(cat /tmp/mcp-count.txt)" = "$expected"

      - name: Upload fbrain-mcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbrain-mcp
          path: dist/fbrain-mcp
          if-no-files-found: error

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        run: |
          echo "check=${{ needs.check.result }}"
          test "${{ needs.check.result }}" = "success"

  publish:
    name: publish
    needs: [ci-required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: EdgeVector/last-stack/.github/workflows/host-track-artifact.yml@main
    with:
      config: .lastgit/artifacts.json
