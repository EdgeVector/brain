# Forge CI for brain on the local Forgejo forge, the gate of record since
# 2026-09-06 (brain: decision-2026-09-06-all-repos-venue-forgejo-no-lastgit-default).
#
# ci-required runs the same .lastgit/ci.sh that gated LastGit change requests,
# on the Mac host lane (macos-arm64), so the gate itself does not change with
# the venue. Branch protection on main requires this context.
#
# Host-mode runners cannot use actions/checkout (the runner's URL patch points
# the forge at host.docker.internal, which only resolves inside Docker jobs, and
# fetching the action from code.forgejo.org took 8 minutes on 2026-09-05), so
# every job clones from the forge ROOT_URL by hand.
name: Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Concurrency (papercut-forge-main-publish-starved-by-cancel-in-progress-20260922).
# Without this block Forgejo cancels every earlier run of this workflow on the
# same branch when a new event arrives. On main that cancelled each waiting or
# running publish run when the next PR merged, so under a deep macos-arm64
# queue no main run finished and host-track never installed merged fixes.
# PR refs still cancel their superseded runs. On main, cancel-in-progress is
# false, and Forgejo runs the main runs of this group one after another, in
# order. Every merge publishes, and an older commit can never promote after a
# newer one (promote has no ancestry check). Keep runs-on unchanged.
concurrency:
  group: forge-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-required:
    name: ci-required
    runs-on: macos-arm64
    timeout-minutes: 15

    steps:
      - name: Checkout repository (host runner)
        env:
          FORGE_TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          server_url="${GITHUB_SERVER_URL%/}"
          server_url="${server_url//host.docker.internal/localhost}"
          repo_url="${server_url}/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$repo_url"
          if ! git -c http.extraHeader="Authorization: token $FORGE_TOKEN" fetch -q --no-tags origin "$GITHUB_SHA"; then
            git -c http.extraHeader="Authorization: token $FORGE_TOKEN" fetch -q --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git checkout -q --detach "$GITHUB_SHA"
          git reset -q --hard
          git clean -ffdxq
          echo "checked out $(git rev-parse --short HEAD) from $repo_url"

      - name: Host toolchains on PATH
        run: |
          for d in "$HOME/.local/bin" "$HOME/.bun/bin" "$HOME/.cargo/bin" /opt/homebrew/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done

      # The runner forces color into every step; the LastGit watcher never did.
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          LASTGIT_CI_CONTEXT: ci-required
          LASTGIT_CI_REPO: brain
          LASTGIT_CI_OID: ${{ github.sha }}
          LASTGIT_SOCKET: /Users/tomtang/.lastdb/data/folddb.sock
          LASTGIT_SCHEMA_MAP: /Users/tomtang/.lastgit/schema-map.json
        run: bash .lastgit/ci.sh

  # publish runs only on a push to main. It re-runs the gate script so build
  # outputs exist, publishes every default-context entry of
  # .lastgit/artifacts.json into the local artifact CAS (~/.lastgit/artifacts),
  # and promotes it to the stable channel with `lastgit artifact promote --gate
  # forgejo` (EdgeVector/lastgit#591), which reads THIS commit's Forge CI status.
  # host-track installs the channel head on its next refresh.
  publish:
    name: publish host-track artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-required
    runs-on: macos-arm64
    timeout-minutes: 25
    env:
      FORGE_TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
      LASTGIT_FORGE_URL: http://localhost:3300
      LASTGIT_SOCKET: /Users/tomtang/.lastdb/data/folddb.sock
      LASTGIT_SCHEMA_MAP: /Users/tomtang/.lastgit/schema-map.json
      NO_COLOR: "1"
      FORCE_COLOR: "0"

    steps:
      - name: Checkout repository (host runner)
        run: |
          set -euo pipefail
          server_url="${GITHUB_SERVER_URL%/}"
          server_url="${server_url//host.docker.internal/localhost}"
          repo_url="${server_url}/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$repo_url"
          if ! git -c http.extraHeader="Authorization: token $FORGE_TOKEN" fetch -q --no-tags origin "$GITHUB_SHA"; then
            git -c http.extraHeader="Authorization: token $FORGE_TOKEN" fetch -q --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git checkout -q --detach "$GITHUB_SHA"
          git reset -q --hard
          git clean -ffdxq
          echo "checked out $(git rev-parse --short HEAD) from $repo_url"

      - name: Host toolchains on PATH
        run: |
          for d in "$HOME/.local/bin" "$HOME/.bun/bin" "$HOME/.cargo/bin" /opt/homebrew/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done

      - name: Build the artifact tree (.lastgit/ci.sh)
        env:
          LASTGIT_CI_CONTEXT: ci-required
          LASTGIT_CI_REPO: brain
          LASTGIT_CI_OID: ${{ github.sha }}
        run: bash .lastgit/ci.sh

      - name: Publish into the artifact CAS and promote stable
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            app="$(printf '%s' "$entry" | jq -r '.app')"
            paths="$(printf '%s' "$entry" | jq -r '.paths | join(",")')"
            platform="$(printf '%s' "$entry" | jq -r '.platform // empty')"
            digest="$(lastgit artifact publish --app "$app" --repo brain --oid "$GITHUB_SHA" --input . --paths "$paths" ${platform:+--platform "$platform"} --json 2>/dev/null \
              | jq -r 'select(.manifest_digest != null) | .manifest_digest' | tail -n 1)"
            test -n "$digest"
            echo "published $app manifest=$digest oid=$GITHUB_SHA"
            promoted=0
            for attempt in 1 2 3 4 5 6; do
              if lastgit artifact promote --gate forgejo --app "$app" --channel stable \
                   --manifest "$digest" --repo brain --oid "$GITHUB_SHA"; then
                promoted=1; break
              fi
              echo "promote attempt $attempt did not pass the forge gate yet; retrying in 10s" >&2
              sleep 10
            done
            test "$promoted" = 1
          done < <(jq -c '.artifacts[] | select(.context == null or .context == "ci-required")' .lastgit/artifacts.json)
